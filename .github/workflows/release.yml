name: Release
run-name: Release ${{ inputs.version }} by @${{ github.actor }}

# Cuts an immutable semver release of seilbahn.
#
# What it does:
#   1. Rewrites every `uses: feuerstein-org/seilbahn/...@v2.4.0 reference in
#      the workflow files to the new version, then commits + pushes that to
#      master. master always reflects the latest release's pinned refs.
#   2. Creates the immutable `vX.Y.Z` tag at that commit.
#   3. Force-moves `vX.Y` (minor) and `vX` (major) to point at the same commit.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v2.4.0 (must be a new semver tag)."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate version and check for collisions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version '$VERSION' is not in vMAJOR.MINOR.PATCH form."
            exit 1
          fi

          if git ls-remote --tags origin | grep -q "refs/tags/$VERSION$"; then
            echo "::error::Tag $VERSION already exists on origin. Bump the version."
            exit 1
          fi

      - name: Pin internal action refs to ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          find .github/workflows -name '*.yml' -print0 \
            | xargs -0 sed -i -E \
              "s|(feuerstein-org/seilbahn/[^@[:space:]]+)@v[0-9]+(\.[0-9]+)*|\1@${VERSION}|g"

          if git diff --quiet; then
            echo "No ref changes required — workflows already pinned to $VERSION (or no internal refs found)."
          else
            echo "--- rewritten refs ---"
            git --no-pager diff
          fi

      - name: Commit and push to master
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add -A
            git commit -m "Release $VERSION"
            git push origin HEAD:master
          fi

      - name: Create and push version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Move major/minor alias tags
        uses: haya14busa/action-update-semver@v1
        with:
          tag: ${{ inputs.version }}
          github_token: ${{ steps.app-token.outputs.token }}
