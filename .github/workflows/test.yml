name: Test

# Reusable PR/test pipeline for Feuerstein service repos. Runs pre-commit
# (lint, format, type-check, deptry) and a parallel test matrix across every
# package that opts in via the caller's root `seilbahn.toml` (opted in by default).
#
# The matrix is language-agnostic: the package list comes from seilbahn.toml and
# each entry runs `mise run test-ci <test-id>`, so what a "test" is stays in the
# consumer repo's mise.ci.toml.
#
# Callers invoke this via:
#   uses: feuerstein-org/seilbahn/.github/workflows/test.yml@v2.1.0
on:
  workflow_call:

env:
  MISE_OVERRIDE_CONFIG_FILENAMES: "mise.ci.toml"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Generate token for private deps
        id: deps-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPS_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure git for private deps
        env:
          GH_DEPS_TOKEN: ${{ steps.deps-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: mise run install-ci

      - name: Pre-commit
        run: mise run pre-commit-ci

  discover-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.config.outputs.test_packages }}
      has_tests: ${{ steps.config.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v7

      - name: Read test matrix from seilbahn.toml
        id: config
        uses: feuerstein-org/seilbahn/.github/actions/extract-config@v2.1.0
        with:
          mode: test

  test-packages:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: discover-packages
    if: needs.discover-packages.outputs.has_tests == 'true'
    strategy:
      matrix:
        package: ${{ fromJson(needs.discover-packages.outputs.packages) }}
      fail-fast: false
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Generate token for private deps
        id: deps-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPS_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure git for private deps
        env:
          GH_DEPS_TOKEN: ${{ steps.deps-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: mise run install-ci

      - name: Test ${{ matrix.package }}
        run: mise run test-ci ${{ matrix.package }}
