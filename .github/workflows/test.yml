name: Test

# Reusable PR/test pipeline for Feuerstein service repos. Runs pre-commit
# (lint, format, type-check, deptry) and a parallel pytest matrix across all
# packages with a `tests/` directory.
#
# Callers invoke this via:
#   uses: feuerstein-org/seilbahn/.github/workflows/test.yml@v1.3.0
on:
  workflow_call:

env:
  MISE_OVERRIDE_CONFIG_FILENAMES: "mise.ci.toml"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Generate token for private deps
        id: deps-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPS_APP_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure git for private deps
        env:
          GH_DEPS_TOKEN: ${{ steps.deps-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: mise run install-ci

      - name: Pre-commit
        run: mise run pre-commit-ci

  discover-python-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: List all Python packages
        id: list-packages
        run: |
          packages="[]"
          for dir in packages/*/; do
            if [ -f "$dir/pyproject.toml" ] && [ -d "$dir/tests" ]; then
              pkg=$(basename "$dir")
              packages=$(echo "$packages" | jq -c ". += [\"$pkg\"]")
            fi
          done
          echo "packages=$packages" >> $GITHUB_OUTPUT
          echo "Found packages with tests: $packages"

  test-python-packages:
    runs-on: ubuntu-latest
    needs: discover-python-packages
    if: needs.discover-python-packages.outputs.packages != '[]'
    strategy:
      matrix:
        package: ${{ fromJson(needs.discover-python-packages.outputs.packages) }}
      fail-fast: false
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Generate token for private deps
        id: deps-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPS_APP_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure git for private deps
        env:
          GH_DEPS_TOKEN: ${{ steps.deps-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: mise run install-ci

      - name: Test Python package - ${{ matrix.package }}
        run: mise run test-ci ${{ matrix.package }}
