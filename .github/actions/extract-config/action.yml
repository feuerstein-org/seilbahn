name: Extract workspace config
description: >
  Read each workspace member's pyproject.toml and emit the artifacts of every
  package whose release tag `name/vN` is missing (a new version) or points at the
  checked-out HEAD (a redeploy). Uses `git ls-remote --tags` as the source of
  truth, so detection is independent of how a push is shaped. Expects to run with
  the consumer repo checked out at the current working directory.

inputs:
  redeploy-package-version:
    description: >
      Rebuild-only redeploy. When set to a release tag `<package>/v<version>`,
      skip tag-based change detection and emit every artifact of that package
      (read from the currently checked-out source).
      Empty = normal change-driven behaviour.
    required: false
    default: ""

outputs:
  artifacts:
    description: JSON array of all changed artifacts.
    value: ${{ steps.run.outputs.artifacts }}
  docker_artifacts:
    description: JSON array filtered to type=docker.
    value: ${{ steps.run.outputs.docker_artifacts }}
  lambda_artifacts:
    description: JSON array filtered to type=lambda.
    value: ${{ steps.run.outputs.lambda_artifacts }}
  packages:
    description: JSON array of changed packages ({name, version, path}).
    value: ${{ steps.run.outputs.packages }}
  has_changes:
    description: '"true" when at least one artifact changed, "false" otherwise.'
    value: ${{ steps.run.outputs.has_changes }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        REDEPLOY_PACKAGE_VERSION: ${{ inputs.redeploy-package-version }}
      run: python3 "${{ github.action_path }}/extract_config.py"
